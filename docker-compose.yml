services:
  solr:
    platform: linux/amd64
    build:
      context: ./compose/solr
      #dockerfile: ./compose/solr/Dockerfile
    image: nomenmatch-solr:8
    ports:
      # 只綁本機,外部無法直接連 Solr;php 走 docker 內部網路(solr:8983)不受影響
      - "127.0.0.1:8984:8983"
    volumes:
      - solr-data:/var/solr/data
      - ./compose/solr:/compose/solr
      - ./solr-workspace:/workspace
      - ./conf/solr-config:/solr-config
    command:
      - solr-precreate
      #- gettingstarted
  nginx:
    platform: linux/amd64
    image: nginx:latest
    ports:
        - "8080:81"
    volumes:
        - ./:/code
        - ./compose/nginx:/etc/nginx/conf.d
  php:
    platform: linux/amd64
    image: php:8.4-fpm
    volumes:
        - ./:/code
        - ./source-data:/code/source-data
        - ./compose/php/prod.ini:/usr/local/etc/php/conf.d/prod.ini:ro

volumes:
  solr-data:
