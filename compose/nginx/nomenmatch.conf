server {
    index index.php index.html;
    server_name localhost;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    root /code;
    listen 81;

    # 隱藏檔(.env、.git 等)
    location ~ /\. {
        return 404;
    }

    # 不對外的目錄:資料、匯入腳本、PHP 函式庫原始碼、部署與 Solr 設定
    location ~ ^/(source-data|solr-workspace|workspace|scripts|compose|include|conf/solr-config)(/|$) {
        return 404;
    }

    # 只允許實際對外使用的 PHP 入口
    location ~ ^/(api|count)\.php$ {
        try_files $uri =404;
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # 其他 .php 一律不執行
    location ~ \.php$ {
        return 404;
    }
}
